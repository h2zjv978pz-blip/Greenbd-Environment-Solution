<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Green rounded background -->
  <rect width="100" height="100" rx="22" fill="#16a34a"/>

  <!-- Subtle inner shadow / depth ring -->
  <rect width="100" height="100" rx="22" fill="none"
        stroke="rgba(0,0,0,0.12)" stroke-width="4"/>

  <!-- Leaf (yellow-green, behind G) -->
  <path d="M56 16
           C 70 10, 86 28, 84 52
           C 82 68, 68 80, 52 76
           C 40 72, 36 58, 44 43
           C 49 32, 56 16, 56 16 Z"
        fill="#86efac"/>

  <!-- Leaf highlight stripe -->
  <path d="M56 16 C 66 34 68 56 52 76"
        stroke="#bbf7d0" stroke-width="3" fill="none"
        stroke-linecap="round" opacity="0.7"/>

  <!-- White G / C ring -->
  <path d="M50 22 A29 29 0 1 0 79 60"
        stroke="white" stroke-width="11" fill="none"
        stroke-linecap="round"/>

  <!-- G horizontal bar -->
  <path d="M63 51 L79 51"
        stroke="white" stroke-width="11" fill="none"
        stroke-linecap="round"/>
</svg>
